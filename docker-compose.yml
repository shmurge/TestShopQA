version: '3.7'

services:
  run_tests_in_chrome:
    image: test-shop-qa
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./:/usr/workspace
    command: /bin/sh -c "ls -la && poetry run pytest -vs --reruns=3 -n=5 --headless --alluredir=allure-results"
    working_dir: /usr/workspace
    environment:
      - USERNAME=${USERNAME}
      - LOGIN=${LOGIN}
      - PASSWORD=${PASSWORD}
  run_tests_in_firefox:
    image: test-shop-qa
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./:/usr/workspace
    command: /bin/sh -c "ls -la && poetry run pytest -vs --reruns=3 -n=5 --headless --browser=firefox --alluredir=allure-results"
    working_dir: /usr/workspace
    environment:
      - USERNAME=${USERNAME}
      - LOGIN=${LOGIN}
      - PASSWORD=${PASSWORD}
  report:
    image: test-shop-qa
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./:/usr/workspace
    command: /bin/sh -c "allure generate allure-results --clean -o allure-report"
    working_dir: /usr/workspace
